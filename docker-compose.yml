# Portainer: Stacks > Add stack > "Repository" (or paste this file and fill in the environment variables).
services:
  icons:
    build: .
    container_name: tzl-icons
    restart: unless-stopped
    ports:
      - "${PORT:-8085}:3000"            # point your reverse proxy at this port
    environment:
      TZL_ROOT_DOMAIN: ${TZL_ROOT_DOMAIN:-rayaz.org}   # change to techzeeland.com when you move; fonts./qrcode./... follow automatically
      TZL_BASE_URL: ${TZL_BASE_URL:-${PUBLIC_URL:-}}   # https://icons.rayaz.org  (docs snippets, sitemap, canonical links)
      TZL_TRUST_PROXY: ${TZL_TRUST_PROXY:-1}           # 1 behind Cloudflare Tunnel / a reverse proxy
      ICONS_REPO_URL: ${ICONS_REPO_URL:-}              # your public icon repo, e.g. https://github.com/you/icons.git
      ICONS_REPO_BRANCH: ${ICONS_REPO_BRANCH:-main}
      ICONS_SUBDIR: ${ICONS_SUBDIR:-icons}             # folder in the repo holding ui/ social/ other/
      SYNC_INTERVAL_SECONDS: ${SYNC_INTERVAL_SECONDS:-300}
      SYNC_TOKEN: ${SYNC_TOKEN:-}                      # enables POST /_sync and signed git webhooks
      SOURCE_URL: ${SOURCE_URL:-}                      # shown in the footer and at /source (AGPL-3.0 section 13)
      CACHE_MAX_AGE: ${CACHE_MAX_AGE:-86400}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      ADMIN_ENABLED: ${ADMIN_ENABLED:-true}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}              # optional; otherwise use the one-time token in the log at /admin/setup
    volumes:
      - icons-data:/data                               # settings, admin login, added icons, stats, synced repo
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

volumes:
  icons-data:
